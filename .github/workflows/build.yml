name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up dependencies
        run: |
          brew install ldid make
          echo "THEOS=${GITHUB_WORKSPACE}/theos" >> "${GITHUB_ENV}"
          echo "PATH=/usr/local/opt/make/libexec/gnubin:${PATH}" >> "${GITHUB_ENV}"
      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Download iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
      - name: Build rootless package
        continue-on-error: true
        run: |
          {
            echo "=== environment ==="
            sw_vers
            xcodebuild -version | head -2
            make --version | head -1
            echo "THEOS=$THEOS"
            ls "$THEOS/sdks" || true
            echo
            echo "=== make ==="
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1
            echo "=== make exit: $? ==="
            echo
            echo "=== packages ==="
            ls -l packages 2>/dev/null || echo "(no packages dir)"
          } | tee build.log
      - name: Publish build log
        if: always()
        run: |
          cp build.log build-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-latest.log
          git commit -m "build log [skip ci]" || true
          git pull --rebase --autostash || true
          git push || true
      - name: Verify slices
        if: always()
        run: |
          DEB=$(ls "$PWD"/packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "no deb produced"; exit 0; fi
          echo "built: $DEB"
          rm -rf /tmp/out && mkdir -p /tmp/out
          ( cd /tmp/out && ar -x "$DEB" && tar -xf data.tar.* ) || echo "unpack failed"
          find /tmp/out -type f 2>/dev/null | while read -r f; do
            file "$f" | grep -q Mach-O || continue
            echo "--- $f"
            lipo -info "$f"
            otool -hv "$f" | sed -n '2p'
          done
      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MoreComplications
          path: packages/*.deb
          if-no-files-found: warn
