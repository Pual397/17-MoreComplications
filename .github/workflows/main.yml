name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          brew install ldid make
          echo "THEOS=${GITHUB_WORKSPACE}/theos" >> "${GITHUB_ENV}"
          echo "PATH=/usr/local/opt/make/libexec/gnubin:${PATH}" >> "${GITHUB_ENV}"

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk

      - name: Build
        run: |
          export PACKAGE_BUILDNAME=dev
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify slices
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "built: $DEB"
          dpkg-deb -x "$DEB" /tmp/out
          find /tmp/out -type f | while read -r f; do
            file "$f" | grep -q Mach-O || continue
            echo "--- $f"
            lipo -info "$f"
            otool -hv "$f" | sed -n '2p'
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: MoreComplications
          path: packages/*.deb
          if-no-files-found: error
